name: Deploy to Bluehost via SSH

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to Bluehost
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        SSH_PORT: ${{ secrets.SSH_PORT }}
      run: |
        # Clean target directory
        ssh -p $SSH_PORT $SSH_USERNAME@$SSH_HOST \
        "cd public_html/italianspiritsco.com && rm -rf *"

        # Create temp folder
        mkdir -p deploy_temp

        # Copy files excluding unwanted folders
        rsync -av \
          --exclude='.git/' \
          --exclude='.github/' \
          --exclude='node_modules/' \
          --exclude='*.log' \
          --exclude='.env' \
          --exclude='deploy_temp/' \
          ./ deploy_temp/

        # Upload files
        scp -P $SSH_PORT -r deploy_temp/* \
          $SSH_USERNAME@$SSH_HOST:/home3/chamelk9/public_html/italianspiritsco.com/

        rm -rf deploy_temp
