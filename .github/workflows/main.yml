name: Deploy to Bluehost via SSH

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          printf "%s" "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf "Host bluehost\n" >> ~/.ssh/config
          printf "  HostName %s\n" "${{ secrets.SSH_HOST }}" >> ~/.ssh/config
          printf "  User %s\n" "${{ secrets.SSH_USERNAME }}" >> ~/.ssh/config
          printf "  Port 22\n" >> ~/.ssh/config
          printf "  IdentityFile ~/.ssh/deploy_key\n" >> ~/.ssh/config
          printf "  IdentitiesOnly yes\n" >> ~/.ssh/config

          chmod 600 ~/.ssh/config

          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Files
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='*.log' \
            --exclude='.env' \
            -e "ssh bluehost" \
            ./ bluehost:/home3/chamelk9/public_html/website_0e9c7b94/
